name: Qualify PNPM workspace fabrication
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/qualify.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-packed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Run source/negative tests and packed-CLI receiving
        run: npm run verify
  pnpm-12-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: native-and-packed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pinned native PNPM 12.9.1 without legacy Corepack
        # Corepack bundled with Node 22.16.0 incorrectly expects pnpm.cjs.
        # PNPM 12 is native; its pinned npm installer requires its own scripts.
        # This step does not approve lifecycle scripts for the customer workspace.
        run: |
          npm install --global --no-audit --no-fund pnpm@12.9.1
          test "$(pnpm --version)" = '12.9.1'
      - name: Receive packed CLI using real PNPM 12.9.1 with positive and negative script controls
        run: npm run verify:pnpm
