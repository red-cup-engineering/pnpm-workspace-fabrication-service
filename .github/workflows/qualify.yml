name: Qualify PNPM workspace fabrication
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/qualify.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-packed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Run source/negative tests and packed-CLI receiving
        run: npm run verify
  pnpm-12-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: native-and-packed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pinned real PNPM program
        run: |
          corepack enable
          corepack prepare pnpm@12.9.1 --activate
          test "$(pnpm --version)" = '12.9.1'
      - name: Receive packed CLI using real PNPM 12.9.1 with positive and negative script controls
        run: npm run verify:pnpm
